[package]
name = "pellikan"
version = "0.0.1"
description = "A local-first Bible study app"
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-or-later"

[lib]
name = "pellikan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles SQLite (with FTS5) into the app, so it never depends on the system's SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }
# Translation packs: downloaded over HTTPS, checked against a SHA-256 from the manifest, then unpacked.
ureq = "2"
sha2 = "0.10"
flate2 = "1"

[dev-dependencies]
# Mock runtime for the IPC tests in lib.rs (no window, no web view).
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
